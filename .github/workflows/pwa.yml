# Reusable CI/CD for a PWA on Firebase Hosting. Callers on the suite's one site (docs/one-site.md):
#
#   jobs:
#     pwa:
#       uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0
#       permissions: { contents: write, id-token: write, pull-requests: write }
#       with:
#         base: /spending/          # the portal: /
#         site-url: https://example-family.web.app/spending/
#
# With `base`, main publishes the build as a release asset (the repo's `hosting` pre-release) and
# deploys the whole site: every app's latest published build under its path (`pwa-site assemble`,
# apps.json from the portal repo). Without `base` (the old per-app sites), `hosting-target` names the
# caller's own site and only it is deployed. `reconcile: true` (the portal's schedule) skips the
# build and redeploys the site only when an app has published a build it lacks, and fixes the old
# sites' redirects when one is wrong.
#
# Caller repo variables: GCP_WIF_PROVIDER, GCP_DEPLOY_SA (deploy is skipped until both are set),
# VITE_FIREBASE_*, VITE_GOOGLE_CLIENT_ID, VITE_VAPID_PUBLIC_KEY, VITE_CONNECTOR_URL (the portal's AI
# assistant connector, huishouden/connector; STAGING_VITE_CONNECTOR_URL for staging), VITE_CALENDAR_URL
# (the calendar feed and Google sync, huishouden/calendar; STAGING_VITE_CALENDAR_URL) and VITE_NEWRELIC_* (only for apps
# without `base`: on the suite's site the deploy serves /hh-observability.json, docs/observability.md;
# staging gets neither, so staging sends no reports). Optional package.json scripts:
# test (unit), e2e (Playwright smoke tests against site-url after each deploy), screenshots
# (Playwright, writes docs/screenshots/*.png; committed back to main when they change, which needs
# contents: write from the caller).
#
# Staging (STANDARD.md "Staging"): with STAGING_GCP_WIF_PROVIDER, STAGING_GCP_DEPLOY_SA,
# STAGING_SITE and STAGING_VITE_FIREBASE_* set (infra/bootstrap.sh --staging), every same-repo PR
# that changes more than docs is built against the huishouden-staging project, deployed to
# https://<STAGING_SITE>.web.app and checked with `e2e` plus the optional `e2e:signed-in` script, in
# households of the run's own that the job removes afterwards. Pass `staging-ref` from a manual run
# to deploy any ref there. Without those variables nothing about staging runs. `staging-sweep: true`
# (the portal's nightly schedule) only removes what runs left behind.
#
# Emulators: with an `e2e:emulator` script, the app-tests job builds the app for the Auth and
# Firestore emulators, loads the household's rules from huishouden/rules main and runs the script
# against it (HH_E2E_TARGET=emulator); staging then runs only the signed-in tests tagged @staging.
name: pwa

on:
  workflow_call:
    inputs:
      base:
        description: The app's path on the suite's one site (/pet/; the portal /). Empty for an app on its own site
        type: string
        default: ''
      hosting-target:
        description: Without base only. Firebase Hosting target from the caller's .firebaserc
        type: string
        default: ''
      site-url:
        description: Live URL the smoke tests run against (with base, the app's path on the site)
        type: string
        required: true
      reconcile:
        description: With base / (the portal's schedule). Redeploy the site if an app published a newer build; no build, no tests
        type: boolean
        default: false
      staging-ref:
        description: Manual runs only. A branch, tag or SHA to deploy to staging instead of deploying production
        type: string
        default: ''
      staging-sweep:
        description: The portal's nightly schedule. Remove staging test households and users over a day old; nothing else runs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  leak-scan:
    if: ${{ !inputs.reconcile && !inputs.staging-sweep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.staging-ref }} # a manual staging deploy scans the ref it ships
      - uses: huishouden/pwa-kit/actions/leak-scan@v0

  build:
    if: ${{ !inputs.reconcile && !inputs.staging-sweep }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      VITE_CONNECTOR_URL: ${{ vars.VITE_CONNECTOR_URL }}
      VITE_CALENDAR_URL: ${{ vars.VITE_CALENDAR_URL }}
      # Error, performance and usage reports (STANDARD.md "Observability"); public browser values.
      VITE_NEWRELIC_ACCOUNT_ID: ${{ vars.VITE_NEWRELIC_ACCOUNT_ID }}
      VITE_NEWRELIC_APP_ID: ${{ vars.VITE_NEWRELIC_APP_ID }}
      VITE_NEWRELIC_BROWSER_KEY: ${{ vars.VITE_NEWRELIC_BROWSER_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.staging-ref }} # empty: the event's own commit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Huishouden design language (DESIGN.md)
        run: bunx pwa-design-check
      - name: Firestore writes go through the kit's outbox
        # Kits before v0.37.0 have no pwa-write-check.
        run: if [ -e node_modules/.bin/pwa-write-check ]; then bunx pwa-write-check; else echo "kit has no pwa-write-check"; fi
      - name: Security headers on every app path, none on Firebase's /__/ (STANDARD.md "Security headers")
        # Kits before v0.43.0 have no pwa-headers-check.
        run: if [ -e node_modules/.bin/pwa-headers-check ]; then bunx pwa-headers-check; else echo "kit has no pwa-headers-check"; fi
      - name: Kit code copied into the app (warnings)
        # Kits before v0.44.0 have no pwa-reuse-check. Warnings only for now: each shows on the PR's files.
        run: if [ -e node_modules/.bin/pwa-reuse-check ]; then bunx pwa-reuse-check; else echo "kit has no pwa-reuse-check"; fi
      - name: Every language has every key; English left in JSX (docs/i18n.md)
        # Kits before v0.60.0 have no pwa-i18n-check. An app without src/locales/en.json passes with a
        # notice until it is translated; untranslated literals warn on the PR's files for now.
        run: if [ -e node_modules/.bin/pwa-i18n-check ]; then bunx pwa-i18n-check; else echo "kit has no pwa-i18n-check"; fi
      - name: Unit tests
        run: if jq -e '.scripts.test' package.json >/dev/null; then bun run test; else echo "no test script"; fi
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 1
      # On main, the builds other repos assemble the site from (docs/one-site.md): this one, and one
      # against the staging project for their pull requests' staging sites.
      - name: Pack the build for the site
        if: inputs.base != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.staging-ref == ''
        env:
          BASE: ${{ inputs.base }}
        run: mkdir -p site-assets && bunx pwa-site pack dist site-assets/site.tar.gz --path "$BASE"
      - name: Staging build for the site
        if: inputs.base != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.staging-ref == '' && vars.STAGING_VITE_FIREBASE_PROJECT_ID != ''
        env:
          BASE: ${{ inputs.base }}
          VITE_FIREBASE_API_KEY: ${{ vars.STAGING_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.STAGING_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.STAGING_VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.STAGING_VITE_GOOGLE_CLIENT_ID }}
          VITE_CONNECTOR_URL: ${{ vars.STAGING_VITE_CONNECTOR_URL }}
          VITE_CALENDAR_URL: ${{ vars.STAGING_VITE_CALENDAR_URL }}
          VITE_VAPID_PUBLIC_KEY: ''
          VITE_NEWRELIC_ACCOUNT_ID: ''
          VITE_NEWRELIC_APP_ID: ''
          VITE_NEWRELIC_BROWSER_KEY: ''
        run: |
          if [ "$VITE_FIREBASE_PROJECT_ID" != huishouden-staging ]; then echo "::error::STAGING_VITE_FIREBASE_PROJECT_ID is not huishouden-staging"; exit 1; fi
          rm -rf dist && bun run build && bunx pwa-site pack dist site-assets/site-staging.tar.gz --path "$BASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.base != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.staging-ref == ''
        with:
          name: site-assets
          path: site-assets
          retention-days: 1

  publish:
    # The only job that writes to the repo's releases. It installs and runs nothing from the repo:
    # it uploads the tarballs the build job packed, replacing the previous ones.
    needs: [build, leak-scan]
    if: inputs.base != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.staging-ref == '' && !inputs.reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-assets
          path: site-assets
      - name: Publish to the hosting pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view hosting -R "$REPO" >/dev/null 2>&1; then
            gh release create hosting -R "$REPO" --prerelease --target "$GITHUB_SHA" --title "Hosting build" \
              --notes "The latest build of main, for the suite's one site (pwa-kit docs/one-site.md). Replaced on every deploy; not a release." \
              || gh release view hosting -R "$REPO" >/dev/null
          fi
          gh release upload hosting -R "$REPO" --clobber site-assets/*.tar.gz

  pr-screenshots:
    # Before/after evidence for every same-repo PR: the PR's build next to the live site, same scenes
    # (the app's `screenshots` script), frozen clock. Read-only: it runs the PR's code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      taken: ${{ steps.shots.outputs.taken }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Skip without a screenshots script
        id: has
        run: echo "present=$(jq -e '.scripts.screenshots' package.json >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.has.outputs.present == 'true'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.has.outputs.present == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - if: steps.has.outputs.present == 'true'
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.has.outputs.present == 'true'
        with:
          name: dist
          path: dist
      - name: Before (live) and after (this PR)
        id: shots
        if: steps.has.outputs.present == 'true'
        env:
          LIVE_URL: ${{ inputs.site-url }}
          BASE: ${{ inputs.base || '/' }}
        run: |
          (bunx vite preview --port 4173 --strictPort >/tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf "http://localhost:4173$BASE" >/dev/null && break; sleep 1; done
          SCREENSHOT_DIR=evidence/before BASE_URL="$LIVE_URL" bun run screenshots || echo "::warning::before screenshots incomplete (new screens are expected to be missing)"
          SCREENSHOT_DIR=evidence/after BASE_URL="http://localhost:4173$BASE" bun run screenshots
          echo "taken=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.shots.outputs.taken == 'true'
        with:
          name: pr-evidence
          path: evidence
          retention-days: 7

  pr-screenshots-comment:
    # Publishes the images on the long-lived pr-evidence branch (never deleted, so links keep working)
    # and posts one comment per PR, updated on every push. Installs and runs nothing from the PR.
    needs: pr-screenshots
    if: needs.pr-screenshots.outputs.taken == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-evidence
          path: evidence
      - name: Publish and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short=${SHA::7}
          dest="pr-$PR/$short"
          work=$(mktemp -d)
          git -C "$work" init -q
          git -C "$work" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git -C "$work" fetch -q --depth 1 origin pr-evidence; then git -C "$work" checkout -q -B pr-evidence FETCH_HEAD; else git -C "$work" checkout -q --orphan pr-evidence; fi
          mkdir -p "$work/$dest" && cp -r evidence/* "$work/$dest/"
          git -C "$work" add -A
          git -C "$work" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "evidence: PR #$PR at $short" || true
          git -C "$work" push -q origin pr-evidence
          raw="https://raw.githubusercontent.com/$REPO/pr-evidence/$dest"
          {
            echo "<!-- pr-evidence -->"
            echo "### Before / after ($short)"
            echo
            echo "Live site vs this PR's build: same scenes, frozen clock, sample data."
            echo
            echo "| Screen | Before (live) | After (this PR) |"
            echo "|---|---|---|"
            for f in evidence/after/*.png; do
              n=$(basename "$f")
              before="(new)"; [ -f "evidence/before/$n" ] && before="![]($raw/before/$n)"
              echo "| ${n%.png} | $before | ![]($raw/after/$n) |"
            done
          } > body.md
          # Found by its marker: the staging comment is ours too, so "edit the last one" could pick it.
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-evidence -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null; else gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null; fi

  app-tests:
    # The signed-in flows on the Auth and Firestore emulators, with the household's real rules
    # (huishouden/rules main): an app with an `e2e:emulator` script runs it here against its own
    # build for the emulators (VITE_USE_EMULATORS, `initApp`), as the invented people of
    # `useTestHousehold` (HH_E2E_TARGET=emulator). Free and unlimited, unlike staging's quota, so
    # every flow that needs no other app and no Worker belongs here. Read-only: it runs the PR's code.
    if: ${{ !inputs.reconcile && !inputs.staging-sweep && inputs.staging-ref == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Skip without an e2e:emulator script
        id: has
        run: echo "present=$(jq -e '.scripts["e2e:emulator"]' package.json >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.has.outputs.present == 'true'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.has.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.has.outputs.present == 'true'
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
          key: app-tests-${{ hashFiles('bun.lock') }}
      - if: steps.has.outputs.present == 'true'
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - name: Build for the emulators
        if: steps.has.outputs.present == 'true'
        env:
          VITE_USE_EMULATORS: 'true'
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_PROJECT_ID: demo-huishouden
          VITE_FIREBASE_AUTH_DOMAIN: localhost
          VITE_FIREBASE_APP_ID: 1:1:web:1
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1'
        run: bun run build
      - name: The household's rules (huishouden/rules main)
        if: steps.has.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/emulators"
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 https://raw.githubusercontent.com/huishouden/rules/main/firestore.rules -o "$RUNNER_TEMP/emulators/firestore.rules"
          echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"auth":{"port":9099},"firestore":{"port":8080},"ui":{"enabled":false},"singleProjectMode":true}}' > "$RUNNER_TEMP/emulators/firebase.json"
      - name: Signed-in tests on the emulators
        if: steps.has.outputs.present == 'true'
        env:
          BASE: ${{ inputs.base || '/' }}
          HH_E2E_TARGET: emulator
          HH_STAGING_RUN: e2e-emulator
        run: |
          (bunx vite preview --port 4173 --strictPort >"$RUNNER_TEMP/preview.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf "http://localhost:4173$BASE" >/dev/null && break; sleep 1; done
          export BASE_URL="http://localhost:4173$BASE"
          npx --yes firebase-tools@14.27.0 emulators:exec --config "$RUNNER_TEMP/emulators/firebase.json" --only auth,firestore --project demo-huishouden "bun run e2e:emulator"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: app-tests-playwright-traces
          path: test-results
          retention-days: 7

  staging-scope:
    # Whether this run goes to staging: a same-repo PR (never a fork's) that changes more than docs,
    # or a manual run given staging-ref. Skipped entirely until the staging variables exist.
    if: >-
      vars.STAGING_GCP_WIF_PROVIDER != '' && vars.STAGING_SITE != '' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && inputs.staging-ref != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      # tests=smoke: a PR that only moves the kit's version (Renovate's or a person's bump) runs the
      # signed-in tests tagged @smoke, not all of them: the kit's own tests and the emulator tests
      # cover the rest, and staging's free quota is shared by every app.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then printf 'deploy=true\ntests=full\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate > "$RUNNER_TEMP/files.json"
          code=$(jq -r '.[].filename' "$RUNNER_TEMP/files.json" | grep -vE '^docs/|\.md$|^LICENSE$' || true)
          if [ -z "$code" ]; then echo "Docs only: staging skipped"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          others=$(echo "$code" | grep -vxE 'package\.json|bun\.lock' || true)
          changed=$(jq -r '.[] | select(.filename == "package.json") | .patch // ""' "$RUNNER_TEMP/files.json" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---)' || true)
          if [ -z "$others" ] && [ -n "$changed" ] && ! echo "$changed" | grep -vqE '^[-+][[:space:]]*"@huishouden/pwa-kit":'; then
            echo "Only the kit's version changed: signed-in tests tagged @smoke"; echo "tests=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "tests=full" >> "$GITHUB_OUTPUT"
          fi

  staging:
    # Builds the PR (or staging-ref) against the staging Firebase project, deploys it to the app's
    # staging site and tests it there, signed in as invented test users in households of the run's
    # own (HH_STAGING_RUN), removed at the end. Runs the PR's code, so it holds only staging
    # credentials and no GitHub write access. One staging run per app at a time, since a run tests
    # the build on the app's one staging site: a newer PR's run cancels a running one, which its
    # PR comment says (rerun it, or push again).
    needs: [build, leak-scan, staging-scope]
    if: needs.staging-scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_SITE }}.web.app${{ inputs.base || '/' }}
    concurrency:
      group: staging-${{ github.repository }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      id-token: write # keyless auth to the staging project only
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.STAGING_VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.STAGING_VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.STAGING_VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.STAGING_VITE_GOOGLE_CLIENT_ID }}
      VITE_CONNECTOR_URL: ${{ vars.STAGING_VITE_CONNECTOR_URL }}
      VITE_CALENDAR_URL: ${{ vars.STAGING_VITE_CALENDAR_URL }}
      BASE_URL: https://${{ vars.STAGING_SITE }}.web.app${{ inputs.base || '/' }}
      # The run's households and people: e2e-<repo>-<run id>-<attempt>[-<spec>] (src/staging.ts).
      HH_STAGING_RUN: e2e-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.staging-ref }}
          persist-credentials: false
      - name: Only ever the staging project
        run: |
          if [ "$VITE_FIREBASE_PROJECT_ID" != huishouden-staging ]; then
            echo "::error::STAGING_VITE_FIREBASE_PROJECT_ID is '$VITE_FIREBASE_PROJECT_ID', not huishouden-staging"; exit 1
          fi
      - id: gcp
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SA }}
          token_format: access_token
      # Staging is on Firebase's free plan: 50,000 document reads, 20,000 writes and 20,000 deletes
      # a day for every app's runs together, reset at midnight Pacific. One read says whether today's
      # are used up, so the job stops with that rather than with a page of timeouts.
      - name: Staging quota
        id: quota
        env:
          TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          code=$(curl -s -o "$RUNNER_TEMP/quota.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'x-goog-user-project: huishouden-staging' \
            'https://firestore.googleapis.com/v1/projects/huishouden-staging/databases/(default)/documents/households/e2e-quota-probe')
          if [ "$code" = 429 ] || grep -q RESOURCE_EXHAUSTED "$RUNNER_TEMP/quota.json"; then
            reset=$(( (24 + $(TZ=America/Los_Angeles date +%z | sed -E 's/^([+-])0?([0-9]+)[0-9]{2}$/\1\2/') * -1) % 24 ))
            echo "::error title=Staging quota exceeded::staging quota exceeded — rerun after $(printf '%02d' "$reset"):00 UTC. The free daily Firestore quota of huishouden-staging is used up (it resets at midnight Pacific); failures in this job are that, not this change."
            exit 1
          fi
          echo "staging Firestore quota: available (probe $code)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to ${{ vars.STAGING_SITE }}
        if: inputs.base == ''
        env:
          TARGET: ${{ inputs.hosting-target }}
          SITE: ${{ vars.STAGING_SITE }}
          REF: ${{ inputs.staging-ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          npx --yes firebase-tools@14.27.0 target:apply hosting "$TARGET" "$SITE" --project huishouden-staging
          npx --yes firebase-tools@14.27.0 deploy --only "hosting:$TARGET" --project huishouden-staging --non-interactive --message "staging $REF"
      # The whole suite on this app's own staging site: this build under its path, every other app's
      # latest staging build under theirs (docs/one-site.md "Staging").
      - name: Deploy the suite with this build to ${{ vars.STAGING_SITE }}
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
          SITE: ${{ vars.STAGING_SITE }}
          REF: ${{ inputs.staging-ref || github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bunx pwa-site assemble --flavor staging --site "$SITE" --own "$BASE=dist" --out site-out
          cd site-out && npx --yes firebase-tools@14.27.0 deploy --only "hosting:$SITE" --project huishouden-staging --non-interactive --message "staging $REF"
      # Kits from 0.72 give each run (and spec file) households of its own, seeded by the specs that
      # need them (useTestHousehold) and removed below. Older kits share one household: reseed it.
      - name: Kit's staging fixtures
        id: kit
        env:
          HH_STAGING_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          if grep -qs cleanupTestRun node_modules/@huishouden/pwa-kit/dist/staging.js; then echo "own=true" >> "$GITHUB_OUTPUT"; echo "Households of this run's own: $HH_STAGING_RUN"; exit 0; fi
          echo "own=false" >> "$GITHUB_OUTPUT"
          if [ ! -e node_modules/.bin/pwa-staging ]; then echo "::notice::Kit older than 0.29; no test household seeded"; exit 0; fi
          echo "::warning::Kit older than 0.72: the shared test household, which other repos' runs change too. Move to 0.72 (useTestHousehold)."
          bunx pwa-staging seed
      - run: bunx playwright install --with-deps chromium
      - name: Smoke tests on staging
        run: if jq -e '.scripts.e2e' package.json >/dev/null; then bun run e2e; else echo "no e2e script"; fi
      # With an e2e:emulator script, the app-tests job runs the signed-in flows on the emulators and
      # staging only those that need it (@staging: other apps on the site, the Workers). A kit-only
      # bump runs the @smoke ones.
      - name: Signed-in tests on staging
        env:
          HH_STAGING_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          HH_STAGING_SA: ${{ vars.STAGING_GCP_DEPLOY_SA }}
          TESTS: ${{ needs.staging-scope.outputs.tests }}
        run: |
          if ! jq -e '.scripts["e2e:signed-in"]' package.json >/dev/null; then echo "no e2e:signed-in script"; exit 0; fi
          if [ "$TESTS" = smoke ]; then set -- --grep @smoke --pass-with-no-tests; echo "::notice::Only the kit's version changed: signed-in tests tagged @smoke"
          elif jq -e '.scripts["e2e:emulator"]' package.json >/dev/null; then set -- --grep @staging --pass-with-no-tests; echo "Signed-in tests tagged @staging (the rest run on the emulators, app-tests)"
          else set --; fi
          bun run e2e:signed-in "$@"
      - name: Remove this run's households and people
        if: always() && steps.kit.outputs.own == 'true'
        continue-on-error: true # the nightly sweep removes what this leaves
        env:
          HH_STAGING_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: bunx pwa-staging cleanup
      - name: Was it the quota?
        if: failure() && steps.quota.outcome == 'success'
        env:
          TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          code=$(curl -s -o "$RUNNER_TEMP/quota.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'x-goog-user-project: huishouden-staging' \
            'https://firestore.googleapis.com/v1/projects/huishouden-staging/databases/(default)/documents/households/e2e-quota-probe')
          if [ "$code" = 429 ] || grep -q RESOURCE_EXHAUSTED "$RUNNER_TEMP/quota.json"; then
            reset=$(( (24 + $(TZ=America/Los_Angeles date +%z | sed -E 's/^([+-])0?([0-9]+)[0-9]{2}$/\1\2/') * -1) % 24 ))
            echo "::error title=Staging quota exceeded::staging quota exceeded — rerun after $(printf '%02d' "$reset"):00 UTC. The free daily Firestore quota of huishouden-staging is used up (it resets at midnight Pacific); failures in this job are that, not this change."
            exit 1
          fi
          echo "staging Firestore quota: available (probe $code)"
      # Only the staging portal's site is an origin of the staging OAuth client (docs/one-site.md
      # "Sign-in origins"): Google allows 10 domains, fewer than the staging sites, and the per-app
      # sites are for these tests, which sign in without Google's prompt.
      - name: Check the staging suite site is an authorized sign-in origin
        if: vars.STAGING_VITE_GOOGLE_CLIENT_ID != ''
        continue-on-error: true # manual Google sign-in only; the tests above don't need it
        run: |
          if [ ! -e node_modules/.bin/pwa-oauth-origins ]; then exit 0; fi
          bunx pwa-oauth-origins "$VITE_GOOGLE_CLIENT_ID" https://huishouden-staging.web.app https://huishouden-staging.firebaseapp.com --project=huishouden-staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: staging-playwright-traces
          path: test-results
          retention-days: 7

  staging-comment:
    # One comment per PR with the staging URL and how the run went, updated on every push.
    # Installs and runs nothing from the PR.
    needs: [staging-scope, staging]
    if: always() && github.event_name == 'pull_request' && needs.staging-scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.staging.result }}
          URL: https://${{ vars.STAGING_SITE }}.web.app${{ inputs.base || '/' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) status="Deployed and tested: smoke and signed-in checks passed." ;;
            failure) status="Deployed or tested with failures; see [the run]($RUN)." ;;
            cancelled) status="Not tested: a newer staging run in this repo took the app's staging site (one run at a time). Rerun the staging job of [the run]($RUN), or push again." ;;
            *) status="Not deployed ($RESULT); see [the run]($RUN)." ;;
          esac
          {
            echo "<!-- staging -->"
            echo "### Staging (${SHA::7})"
            echo
            echo "$URL"
            echo
            echo "$status"
            echo
            echo "Staging is a separate Firebase project with invented data; nothing here reaches a real household. To try it by hand, sign in with Google and start a household on the staging portal (https://huishouden-staging.web.app). Each app has one staging site, so it shows whichever PR deployed last."
          } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- staging -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null; else gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null; fi

  deploy:
    # Without base: the caller's own site. With base: the whole site, assembled from every app's
    # latest published build (this run's own was published just before), then checked again in case
    # another app published meanwhile. Runs nothing from the repo with these credentials: the
    # assembler comes from the kit at the version the repo pins, firebase-tools at an exact version.
    needs: [build, leak-scan, publish]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != '' && inputs.staging-ref == ''
      && (inputs.reconcile && inputs.base != ''
          || !inputs.reconcile && needs.build.result == 'success' && needs.leak-scan.result == 'success' && (inputs.base == '' || needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # One deploy of the site per repo at a time; other repos' deploys are reconciled by the recheck.
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud via Workload Identity Federation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.base == ''
        with:
          name: dist
          path: dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: inputs.base != ''
      - name: The kit's site assembler, at the version this repo pins
        if: inputs.base != ''
        run: |
          spec=$(jq -r '(.devDependencies // {})["@huishouden/pwa-kit"] // (.dependencies // {})["@huishouden/pwa-kit"] // empty' package.json)
          ref=${spec##*#}
          if [ -z "$spec" ] || [ "$ref" = "$spec" ]; then echo "::error::package.json must pin @huishouden/pwa-kit to a tag (github:huishouden/pwa-kit#vX.Y.Z)"; exit 1; fi
          git clone -q --depth 1 --branch "$ref" https://github.com/huishouden/pwa-kit.git "$RUNNER_TEMP/pwa-kit"
          echo "SITE_TOOL=$RUNNER_TEMP/pwa-kit/scripts/site.ts" >> "$GITHUB_ENV"
      - name: Is the live site behind? Do the old sites redirect?
        id: live
        if: inputs.base != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE: ${{ inputs.reconcile }}
        run: |
          if [ "$RECONCILE" = true ]; then
            site=$(jq -r '.[] | select(.path == "/") | .site' apps.json)
            bun "$SITE_TOOL" stale --flavor production --manifest "https://$site.web.app/hh-site.json"
          fi
          bun "$SITE_TOOL" redirects-check
      - name: Assemble the site
        id: site
        if: inputs.base != '' && (!inputs.reconcile || steps.live.outputs.stale == 'true' || steps.live.outputs.wrong == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          REDIRECTS: ${{ steps.live.outputs.wrong }}
        run: |
          if [ "$REDIRECTS" = true ]; then bun "$SITE_TOOL" assemble --flavor production --out site-out --redirects
          else bun "$SITE_TOOL" assemble --flavor production --out site-out; fi
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: inputs.base == '' || steps.site.outcome == 'success'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      # An exact version: this step holds production credentials, so it never picks up a release
      # published since the last change here (Renovate proposes updates to it).
      - name: Deploy the app's own site
        if: inputs.base == ''
        run: npx --yes firebase-tools@14.27.0 deploy --only "hosting:${{ inputs.hosting-target }}" --non-interactive --message "${{ github.sha }}"
      - name: Deploy the site
        if: steps.site.outcome == 'success'
        env:
          ONLY: ${{ steps.site.outputs.only }}
          GH_TOKEN: ${{ github.token }}
          WHY: ${{ inputs.reconcile && 'reconcile' || github.repository }}
        run: |
          deploy() { (cd site-out && npx --yes firebase-tools@14.27.0 deploy --only "$1" --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" --non-interactive --message "$WHY ${GITHUB_SHA::7}"); }
          deploy "$ONLY"
          # Another repo may have published between this run's download and its deploy; if so, its
          # build is missing here and this deploy may have replaced one that had it. Up to three rounds.
          for round in 1 2 3; do
            sleep 20
            bun "$SITE_TOOL" stale --flavor production --manifest site-out/public/hh-site.json > "$RUNNER_TEMP/stale.txt"
            cat "$RUNNER_TEMP/stale.txt"
            grep -q '^stale=true' "$RUNNER_TEMP/stale.txt" || exit 0
            echo "::notice::round $round: another app published meanwhile; assembling again"
            bun "$SITE_TOOL" assemble --flavor production --out site-out > "$RUNNER_TEMP/assemble.txt"
            cat "$RUNNER_TEMP/assemble.txt"
            deploy "hosting:$(sed -n 's/^site=//p' "$RUNNER_TEMP/assemble.txt")"
          done

  smoke:
    # Real-browser checks against the live site, right after it changes. Read-only: it runs installed
    # packages and test code, so it gets no push rights; screenshots leave as an artifact.
    needs: deploy
    if: ${{ !inputs.reconcile }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      screenshots: ${{ steps.shots.outputs.taken }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Skip without an e2e script
        id: has-e2e
        run: echo "present=$(jq -e '.scripts.e2e' package.json >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.has-e2e.outputs.present == 'true'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.has-e2e.outputs.present == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - if: steps.has-e2e.outputs.present == 'true'
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - if: steps.has-e2e.outputs.present == 'true'
        run: bun run e2e
        env:
          BASE_URL: ${{ inputs.site-url }}
      # Chrome's sign-in prompt needs the site registered on the OAuth client, which no API can do.
      # Only the suite's site, the project's default one (docs/one-site.md "Sign-in origins"), and
      # the auth handler: the old per-app sites only redirect.
      - name: Check the suite site is an authorized sign-in origin
        if: steps.has-e2e.outputs.present == 'true' && vars.VITE_GOOGLE_CLIENT_ID != ''
        run: |
          if [ ! -e node_modules/.bin/pwa-oauth-origins ]; then echo "::notice::Kit older than 0.16; origin check skipped"; exit 0; fi
          bunx pwa-oauth-origins "$CLIENT_ID" "https://$PROJECT.web.app" "https://$PROJECT.firebaseapp.com" --project="$PROJECT"
        env:
          CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          PROJECT: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      - name: Take README screenshots
        id: shots
        if: steps.has-e2e.outputs.present == 'true'
        env:
          BASE_URL: ${{ inputs.site-url }}
        run: |
          if jq -e '.scripts.screenshots' package.json >/dev/null; then bun run screenshots && echo "taken=true" >> "$GITHUB_OUTPUT"; else echo "no screenshots script"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.shots.outputs.taken == 'true'
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  screenshots:
    # The only job with push rights: it installs and runs nothing from the repo, it just commits the
    # PNGs the smoke job produced when they differ. GITHUB_TOKEN pushes don't trigger workflows.
    needs: smoke
    if: needs.smoke.outputs.screenshots == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: screenshots
          path: docs/screenshots
      - name: Commit when changed
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then echo "screenshots unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: refresh screenshots from ${GITHUB_SHA::7}"
          git pull --rebase -q && git push -q || echo "::warning::screenshots not pushed (main moved); next deploy retries"

  staging-sweep:
    # The portal's nightly schedule (staging-sweep: true): removes staging test households and users
    # over a day old that a cancelled or killed run left, and the shared household of kits before
    # 0.72. The kit's own code at the version the repo pins; nothing from the repo runs.
    if: inputs.staging-sweep && vars.STAGING_GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: The kit, at the version this repo pins
        run: |
          spec=$(jq -r '(.devDependencies // {})["@huishouden/pwa-kit"] // (.dependencies // {})["@huishouden/pwa-kit"] // empty' package.json)
          ref=${spec##*#}
          if [ -z "$spec" ] || [ "$ref" = "$spec" ]; then echo "::error::package.json must pin @huishouden/pwa-kit to a tag (github:huishouden/pwa-kit#vX.Y.Z)"; exit 1; fi
          git clone -q --depth 1 --branch "$ref" https://github.com/huishouden/pwa-kit.git "$RUNNER_TEMP/pwa-kit"
      - id: gcp
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SA }}
          token_format: access_token
      - name: Sweep
        env:
          HH_STAGING_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          if ! grep -q sweepStaging "$RUNNER_TEMP/pwa-kit/scripts/staging.ts"; then echo "::notice::The pinned kit has no sweep (0.72+)"; exit 0; fi
          bun "$RUNNER_TEMP/pwa-kit/scripts/staging.ts" sweep
