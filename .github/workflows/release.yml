# Retired (pwa-kit 0.91.0): release-please no longer runs. pwa.yml's `release` job tags and releases
# on merge to main from the commit titles (STANDARD.md "Versions"). Kept so callers that still list `release:` don't fail;
# remove the job from the caller's ci.yml.
name: release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "release-please is retired; see STANDARD.md Versions"
