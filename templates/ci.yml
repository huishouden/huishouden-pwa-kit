name: ci

# main only: pull requests run no hosted CI; their author verifies them (pwa-kit STANDARD.md
# "Pull requests"). Each push to main builds, tests, deploys, smoke-checks over HTTP and tags the
# package.json version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging-ref:
        description: Deploy this branch, tag or SHA to staging (leave empty to deploy main to production)
        type: string
        default: ''

concurrency:
  # A manual staging deploy from main must not cancel main's production deploy.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.staging-ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pwa:
    uses: huishouden/pwa-kit/.github/workflows/pwa.yml@v0
    permissions:
      contents: write # the hosting release asset, the version's tag and release
      id-token: write
    with:
      base: /APP_PATH/ # the app's path on the suite's one site (docs/one-site.md)
      site-url: https://FAMILY_SITE.web.app/APP_PATH/
      staging-ref: ${{ inputs.staging-ref }}
    # The asset CDN's upload (pwa-kit docs/one-site.md "Asset CDN"); only these two secrets.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

